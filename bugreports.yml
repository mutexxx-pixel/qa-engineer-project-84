---
- summary: |
    При перезагрузке страницы после полного удаления корзины товары снова появляются в корзине
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Добавить несколько товаров в корзину
    2. Перейти в корзину
    3. Нажать на "Очистить корзину"
    4. Перезагрузить страницу
  expected-result: |
    Корзина будет пустая
  actual-result: |
    Товары вернулись в корзину после удаления

- summary: |
    При переключении страниц меняется колонка с фильтрами
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Нажать "Следующая" или "Предыдущая"
  expected-result: |
    Шапка сайта, колонка с фильтрами, подвал сайта останутся неизменными, фильтры не сбросятся
  actual-result: |
    Колонка с фильтрами подстраивается под текущую страницу: меняются производители

- summary: |
    В каталоге карточки товаров разного размера
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти в DevTools
    2. Посмотреть размер секции с карточкой первого товара
    3. Посмотреть размер секции с карточкой пятого товара
    4. Посмотреть размер секции с карточкой тридцатого товара
  expected-result: |
    Размер секций должен быть одинаковый
  actual-result: |
    Размер секций разный 

- summary: |
    Не работает "крестик" у окна после оформления заказа
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Добавить любой товар в корзину
    3. Нажать "Cart"
    4. Нажать "Checkout"
    5. Нажать "крестик"
  expected-result: |
    Окно закроется
  actual-result: |
    "Крестик" неактивная кнопка

- summary: |
    Разное количество товаров на страницах
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Пролистать главную страницу до конца
    2. Перейти на следующую страницу
    3. Пролистать страницу до конца
    4. Повторить данные шаги до перехода на последнюю страницу
    5. Пролистать последнюю страницу до конца
  expected-result: |
    Карточка каждого товара содержит: наименование, фото, зачеркнутую цену без скидки, цену со скидкой, оставшееся количество и кнопку "В корзину"
    На каждой странице отображается одинаковое количество товаров
    На последней странице может отображаться меньшее количество товаров
  actual-result: |
    На 4, 5 и 6 страницах отображается 29 товаров вместо 30

- summary: |
    Невозможно перейти на отфильтрованную по категории страницу при клике на хэштег в карточке товара
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти в карточку товара Red Lipstick
    2. Нажать на категорию товара
  expected-result: |
    Должна открыться главная страница сайта с выставленным фильтром по данной категории
  actual-result: |
    Хэштег в карточке товара неактивный

- summary: |
    Фильтр товаров по наличию работает неверно
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Убрать галочку у фильтра "В наличии"
  expected-result: |
    Будут показаны абсолютно все товары: не только товары в наличии, но и товары, которых сейчас нет.
  actual-result: |
    Каталог пустой

- summary: |
    Описание и название товаров не переводится с английского на русский
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Нажать "Language"
    3. Выбрать "Russian"
  expected-result: |
    Названия и описания товаров, кнопки и весь интерфейс сайта, кроме названий Производителей, должен быть переведен на русский язык
  actual-result: |
    На русский перевелся только интерфейс сайта и кнопки, названия и описания товаров остались на английском языке

- summary: |
    Фильтрация товаров по производителю и категории работает постранично
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Выставить фильтр по любой категории
    2. Перейти на следующую страницу
    3. Перейти на предыдущую страницу
    4. Снять фильтр по категории
    5. Выставить фильтр по любому производителю
    6. Перейти на следующую страницу
  expected-result: |
    На главной странице каталога со всех страниц каталога будут выбраны сначала товары определенной категории, а затем товары определенного производителя
    При переключении на следующую страницу фильтр в колонке должен остаться
    На главной странице в колонке фильтров должны быть все производители и все категории, встречающиеся в каталоге
  actual-result: |
    Фильтрация по категории и производителю работает постранично: в колонку с фильтрами выводятся только те категории и производители, которые есть на странице

- summary: |
    Фильтр товаров по цене работает по старой цене без учета скидки и постранично
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Выставить фильтр по цене: от 1 до 8.99
    2. Переключиться на следующую страницу
  expected-result: |
    Со всех страниц будут показаны только товары, у которых цена со скидкой от 1 до 8.99
    При переключении на следующую страницу фильтр в колонке должен остаться
  actual-result: |
    Фильтр по цене работает постранично: фильтруются только товары на текущей странице, товары с других страниц не подтягиваются
    Фильтр работает по старой цене без учета скидки
    Фильтр по цене на следующей странице остался

- summary: |
    Фильтр товаров по ключевому слову работает постранично
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Выставить фильтр по ключевому слову в строке "Поиск": Red
    2. Переключиться на следующую страницу
  expected-result: |
    Со всех страниц будут показаны только товары, у которых в названии есть слово Red
    При переключении на следующую страницу фильтр в строке должен остаться
  actual-result: |
    Фильтр работает постранично: фильтруются только товары на текущей странице, товары с других страниц не подтягиваются
    Фильтр на следующей странице остался

- summary: |
    Строка "Поиск" в мобильной версии заходит за кнопки "Last" и "Next"
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
