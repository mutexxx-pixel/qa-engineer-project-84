---
- summary: |
    Короткое описание ошибки
  environment: |
    Ссылка на билд/коммит/версия ПО и всего окружения
  steps-to-reproduce: |
    Полный перечень шагов для воспроизведения и описание, на каком шаге произошла ошибка
  expected-result: |
    Какой результат должен быть без ошибки
  actual-result: |
    Какой результат получился на самом деле
    
- summary: |
    Описание и название товаров не переводится с английского на русский
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Нажать "Language"
    3. Выбрать "Russian"
  expected-result: |
    Названия и описания товаров, кнопки и весь интерфейс сайта, кроме названий Производителей, должен быть переведен на русский язык
  actual-result: |
    На русский перевелся только интерфейс сайта и кнопки, названия и описания товаров остались на английском языке.

- summary: |
    При переключении на следующую страницу пропадает колонка фильтров с производителями
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Нажать "Next"
  expected-result: |
    Колонка "Brand" не изменится.
  actual-result: |
    В колонку "Brand" попадают только производители товаров с текущей страницы. У товаров со 2 страницы полностью отсустствуют производители и поэтому фильтр по производителю невозможен, а колонка "Brand" пустая
