- summary: |
    Строка "Поиск" в мобильной версии заходит за кнопки "Last" и "Next"
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Выставить параметры размера сайта 402х874
  expected-result: |
    Все элементы на странице видны и пропорциальны, не заходят друг на друга
    Сбоку, сверху и внизу нет пустых блоков
  actual-result: |
    Ошибка изображена на скриншоте photo_2026-08-25_16-36-32.jpg

- summary: |
    В корзине не отображается текущая цена единицы товара
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Добавить 3 единицы товара Essence Mascara Lash Princess в корзину
    3. Нажать "Cart"
  expected-result: |
    В корзине должна быть видна строка с наименованием товара, количеством в заказе, старой ценой и текущей ценой
  actual-result: |
    Ошибка изображена на скриншоте 2026-08-25 221232.png
    
- summary: |
    На главной (первой) странице сайта видна кнопка "Previous"
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    Перейти на главную страницу сайта https://products-store.hexlet.app/
  expected-result: |
    На главной странице для переключения страниц должна быть видна только кнопка "Next"
  actual-result: |
    На главной (первой) странице сайта видна кнопка "Previous"

- summary: |
    На последней (седьмой) странице сайта видна кнопка "Next"
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Нажать на кнопку "Next" шесть раз
  expected-result: |
    На последней странице для переключения страниц должна быть видна только кнопка "Previous"
  actual-result: |
    На последней (седьмой) странице сайта видна кнопка "Next"
    
- summary: |
    В поле цена можно ввести любое значение
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Поставить минимальное значение цены -4
    3. Поставить максимальное значение цены "MM;"
  expected-result: |
    В полях для ввода минимального и максимального значения цены ничего не появится, поля останутся пустыми
  actual-result: |
    В поля можно ввести некорректные значения
    Предупреждение "Пожалуйста, введите число" появляется редко при долгом наведении мышки на поле
    
- summary: |
    Описание и название товаров не переводится с английского на русский
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Нажать "Language"
    3. Выбрать "Russian"
  expected-result: |
    Названия и описания товаров, кнопки и весь интерфейс сайта, кроме названий Производителей, должен быть переведен на русский язык
  actual-result: |
    На русский перевелся только интерфейс сайта и кнопки, названия и описания товаров остались на английском языке

- summary: |
    Информация об оформлении заказа не уходит на сервер
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. У товара Eyeshadow Palette with Mirror нажать на кнопку "Add to cart" 3 раза
    3. Нажать на "Cart"
    4. Нажать "Checkout"
  expected-result: |
    На сервер должен уйти ответ {products: [{id: 2, quantity: 5}], total: 81.76909500000001}
    statusCode при ответе от сервера должен быть 200
  actual-result: |
    Ответ от сервера: {message: "Failed to create order", statusCode: 500}

- summary: |
    При переключении на следующую страницу пропадает колонка фильтров с производителями
  environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта https://products-store.hexlet.app/
    2. Нажать "Next"
  expected-result: |
    Колонка "Brand" не изменится
  actual-result: |
    В колонку "Brand" попадают только производители товаров с текущей страницы
    У товаров со 2 страницы полностью отсустствуют производители и поэтому фильтр по производителю невозможен, а колонка "Brand" пустая
