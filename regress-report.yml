bugreports:
- summary: |
        Фото товара обрезается в карточке товара (размер фото слишком большой)
    environment: |
        Yandex Browzer 26.8.0.1788 (64-bit)
        ОС Windows 10 Pro
    steps-to-reproduce: |
        1. Открыть главную страницу
        2. Пролистать страницу до конца
        3. Перейти на следующую страницу
    expected-result: |
        Размер фото в карточке товара в каталоге корректный, фото не обрезается
    actual-result: |
        Большинство фотографий в каталоге обрезано

- summary: |
        Фильтр товаров по наличию убирает кнопку "Next"
    environment: |
        Yandex Browzer 26.8.0.1788 (64-bit)
        ОС Windows 10 Pro
    steps-to-reproduce: |
        1. Открыть главную страницу
        2. Убрать галочку "In stock"
    expected-result: |
        Будут показаны не только товары в наличии, но и товары, которых нет на складе
    actual-result: |
        Список товаров не изменился, кнопка "Next" исчезла

- summary: |
    На мобильном устройстве колонка с фильтрами и поиском товара отображается после всего каталога
environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
steps-to-reproduce: |
    1. Открыть главную страницу
    2. Пролистать страницу до конца
expected-result: |
    Колонка с фильтрами должна быть сбоку/сверху каталога
actual-result: |
    Колонка с фильтрами в конце каталога

- summary: |
    При нажатии на кнопку "Магазин" языковые настройки сбрасываются до английского языка
environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
steps-to-reproduce: |
    1. Выставить язык - русский
    2. Нажать на кнопку "Магазин"
expected-result: |
    Ничего не изменится
actual-result: |
    Языковые настройки сброшены до английского языка

- summary: |
    При фильтрации по категории, производителю и цене пропадает кнопка "Next"
environment: |
    Yandex Browzer 26.8.0.1788 (64-bit)
    ОС Windows 10 Pro
steps-to-reproduce: |
    1. Выбрать фильтр по категории
    2. Сбросить фильтр по категории
    3. Выбрать фильтр по производителю
    4. Сбросить фильтр по производителю
    5. Выбрать фильтр по цене
    6. Сбросить фильтр по цене
expected-result: |
    Будут доступны фильтры по всем возможным категориям и производителям
    Со всех страниц будут выведены товары, подходящие по фильтрам
actual-result: |
    Фильтрация идет постранично
    Пропала кнопка переключения на следующую страницу
