    Товар первый = Essence Mascara Lash Princess
    Количество первого товара = 2
    Товар второй = Eyeshadow Palette with Mirror
    Количество второго товара = 3
    Товар третий = Powder Canister
    Количество третьего товара = 1
    Сумма = Цена со скидкой*Количество
  steps: 
    - Добавить в корзину 2 единицы товара Essence Mascara Lash Princess
    - Добавить в корзину 3 единицы товара Eyeshadow Palette with Mirror
    - Добавить в корзину 1 единицу товара Powder Canister
    - Перейти в корзину
  expected-result: |
    В корзине должно отображаться 2 единицы товара Essence Mascara Lash Princess, 3 единицы товара Eyeshadow Palette with Mirror, 1 единицу товара Powder Canister, в сессионном хранилище появилось значение параметра "cart"
    На странице корзины для каждого товара указано количество, цена со скидкой и без скидки, сумма

