- summary: |
    Успешная смена языка с русского на английский
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки
  prerequisites: |
    Открыта главная страница, выбран язык "Russian"
  test-data: |
    Язык = "English"
  steps: 
    - Нажать на кнопку "Язык"
    - Выбрать "English"
    - Открыть любую карточку товара
    - Добавить товар в корзину
    - Вернуться на главную страницу
    - Перейти в корзину
    - Оформить заказ
  expected-result: |
    Весь текст на сайте будет показан на английском языке

