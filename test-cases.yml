- summary: |
    Успешное отображение сайта на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Размеры сайта выставлены на 402x874 (= IPhone 17), открыта главная страница сайта
  test-data: |
    Размеры экрана 402x874 (= IPhone 17)
  steps: 
    - Пролистать каталог до конца
    - Выставить фильтр товаров по производителю
    - Снять фильтр товаров по производителю
    - Выставить фильтр товаров по любой категории
    - Снять фильтр товаров по категории
    - Выставить фильтр товаров по цене
    - Перейти в карточку любого товара
    - Добавить товар в корзину 2 раза
    - Перейти в корзину
    - Удалить 1 единицу товара
    - Оформить заказ
  expected-result: |
    На главной странице колонка с фильтрами видна полностью, на шапке сайта кнопки расположены в одну строку, список товаров отображается полностью, видны картинки, название и описание товаров
    Фильтр товаров по производителю, категории и цене работает
    На карточке товара видны полностью название товара, фотография товара, его описание, старая и новая цена, количество
    2 единицы товара успешно добавились в корзину
    Успешно удалена 1 единица товара
    Кнопка "Оформить заказ" работает

