---
- summary: |
    Успешное добавление единицы товара в корзину
  requirement: |
   Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница, корзина пустая
  test-data: |
    Товар = Essence Mascara Lash Princess
  steps: 
    - Нажать на название товара
    - Нажать на кнопку "В корзину"
    - Нажать на кнопку "Корзина" в шапке сайта
  expected-result: |
    В корзине должна появиться 1 единица товара Essence Mascara Lash Princess, в сессионном хранилище появилось значение параметра "cart".

- summary: |
    Успешное переключение на следующую страницу
  requirement: |
   Сайт должен иметь возможность переключения между страницами каталога товаров
  prerequisites: |
    Открыта главная страница
  test-data: |
    Отсутствует
  steps: 
    - Нажать на кнопку "Следующая"
  expected-result: |
    Шапка, подвал сайта, а также колонка с фильтрами должна остаться неизменной. Изменится только каталог товаров.
    
- summary: |
    Проверка на добавление в корзину на 1 единицу товара больше, чем его есть на складе
  requirement: |
    Контроль остатков
  prerequisites: |
    Открыта главная страница, корзина пустая
  test-data: |
    Товар = Dolce Shine Eau de
  steps: 
    - Нажать на название товара
    - Нажать на кнопку "В корзину" 5 раз
    - Нажать на кнопку "Корзина" в шапке сайта
  expected-result: |
    В корзине должно появиться только 4 единицы товара Dolce Shine Eau de. Кнопка "В корзину" после 4 нажатия будет неактивна

- summary: |
    Успешная смена языка с русского на английский
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки
  prerequisites: |
    Открыта главная страница, выбран язык "Russian"
  test-data: |
    Язык = "English"
  steps: 
    - Нажать на кнопку "Язык"
    - Выбрать "English"
  expected-result: |
    Весь текст на сайте будет показан на английском языке

- summary: |
    Успешная смена языка с английского на русский
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки
  prerequisites: |
    Открыта главная страница, выбран язык "English"
  test-data: |
    Язык = "Russian"
  steps: 
    - Нажать на кнопку "Language"
    - Выбрать "Russian"
  expected-result: |
    Весь текст на сайте будет показан на русском языке, кроме названий в списке "Производители", а также этих названий в наименовании товара.

- summary: |
    Успешный фильтр товаров по производителю
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница, поставлена галочка "В наличии"
  test-data: |
    Производитель = "Essence"
  steps: 
    - Поставить галочку у производителя "Essence"
  expected-result: |
    Должны быть показаны только товары бренда "Essence"

- summary: |
    Успешный фильтр товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница, поставлена галочка "В наличии"
  test-data: |
    Категория = "beauty"
  steps: 
    - Выбрать категорию "beauty"
  expected-result: |
    Должны быть показаны только товары, у которых категория в карточке товара "#beauty"
    
- summary: |
    Успешный фильтр товаров по цене
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница, поставлена галочка "В наличии"
  test-data: |
    - Минимальная цена = 5
    - Максимальная цена = 10
  steps: 
    - Поставить минимальное значение цены ("От") 5
    - Поставить максимальное значение цены ("До") 10
  expected-result: |
    Должны быть показаны только товары, у которых цена в диапазоне от 5 до 10 USDT

- summary: |
    Успешное отображение главной страницы сайта на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Размеры сайта выставлены на 402x874 (= IPhone 17), открыта главная страница сайта
  test-data: |
    Размеры сайта 402x874 (= IPhone 17)
  steps: 
    - Пролистать сайт до конца
  expected-result: |
    Колонка с фильтрами видна полностью, на шапке сайта кнопки расположены в одну строку, список товаров отображается полностью, видны картинки, название и описание товаров  

- summary: |
    Успешный фильтр товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница, поставлена галочка "В наличии"
  test-data: |
    Ключевое слово = "red"
  steps: 
    - В строке "Поиск" ввести ключевое слово "red"
  expected-result: |
    Должны быть показаны только товары, у которых в названии есть ключевое слово "red"
    
- summary: |
    Проверка на ввод отрицательного значения цены
  requirement: |
    В полях для ввода максимального и минимального значения цен должен быть запрет на некорректные значения
  prerequisites: |
    Открыта главная страница
  test-data: |
    - Минимальная цена = -4
    - Максимальная цена = -10
  steps: 
    - Поставить минимальное значение цены ("От") -4
    - Поставить максимальное значение цены ("До") -10
  expected-result: |
    В полях для ввода минимального и максимального значения цены ничего не появится, поля останутся пустыми

- summary: |
    Проверка на ввод буквенного значения цены
  requirement: |
    В полях для ввода максимального и минимального значения цен должен быть запрет на некорректные значения
  prerequisites: |
    Открыта главная страница
  test-data: |
    - Минимальная цена = "ф@ф"
    - Максимальная цена = "q!q"
  steps: 
    - Поставить минимальное значение цены ("От") "ф@ф"
    - Поставить максимальное значение цены ("До") "q!q"
  expected-result: |
    В полях для ввода минимального и максимального значения цены ничего не появится, поля останутся пустыми

- summary: |
    Проверка на уязвимость к XSS атакам
  requirement: |
    На сайте должна быть защита от XSS атак
  prerequisites: |
    Открыта главная страница
  test-data: |
    Скрипт = <script>alert(1)</script>
  steps: 
    - Поставить минимальное значение цены ("От") "<script>alert(1)</script>"
    - Поставить максимальное значение цены ("До") "<script>alert(1)</script>"
    - Поставить в строку "Поиск" значение "<script>alert(1)</script>"
  expected-result: |
    На сайте не должно отобразиться предупреждение
    Работа сайта должна продолжиться в обычном режиме
    
- summary: |
    Успешное оформление заказа
  requirement: |
    Пользователь должен иметь возможность оформить заказ
  prerequisites: |
    Открыта главная страница, поставлена галочка "В наличии"
  test-data: |
    - Товар = Eyeshadow Palette with Mirror
    - Количество = 3
  steps: 
    - У товара Eyeshadow Palette with Mirror нажать на кнопку "В корзину" 3 раза
    - Нажать на "Корзина"
    - Нажать "Оформить заказ"
  expected-result: |
    На сервер должен уйти ответ с наименованием Eyeshadow Palette with Mirror и количеством 3 ({products: [{id: 2, quantity: 5}], total: 81.76909500000001}), statusCode должен быть 200
