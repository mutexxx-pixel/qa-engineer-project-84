---
- summary: |
    Успешное добавление единицы товара в корзину
  requirement: |
   Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница, корзина пустая
  test-data: |
    Товар = Essence Mascara Lash Princess
    Количество товара = 1
    Сумма = Цена со скидкой*Количество
  steps: 
    - Нажать на название товара
    - Нажать на кнопку "В корзину"
    - Нажать на кнопку "Корзина" в шапке сайта
  expected-result: |
    В корзине должна появиться 1 единица товара Essence Mascara Lash Princess, в сессионном хранилище появилось значение параметра "cart"
    На странице корзины указано количество, цена товара со скидкой и без скидки, сумма

- summary: |
    Корректное отображение товаров в каталоге
  requirement: |
    На каждой странице каталога должно быть одинаковое количество товаров (кроме последней, там допускается меньшее количество)
  prerequisities: |
    Открыта главная страница
  test-data: |
    Отсутствует
  steps: 
    - Пролистать главную страницу до конца
    - Перейти на следующую страницу
    - Пролистать страницу до конца
    - Повторить данные шаги до перехода на последнюю страницу
    - Пролистать последнюю страницу до конца
  expected-result: |
    На каждой странице отображается одинаковое количество товаров
    На последней странице может отображаться меньшее количество товаров

